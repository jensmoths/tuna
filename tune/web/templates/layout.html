<!doctype html>
<html><head><meta charset="utf-8"><title>Tuna Operator Console</title>
<style>
body{font-family:system-ui,sans-serif;color:#111;background:#fff;max-width:1000px;margin:2rem auto;padding:0 1rem;line-height:1.4}a{color:#000}nav{border-bottom:1px solid #000;padding-bottom:.5rem;margin-bottom:1.5rem}nav a{margin-right:1rem}.card{border:1px solid #000;padding:1rem;margin:1rem 0}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:1rem}.muted{color:#555}table{border-collapse:collapse;width:100%}td,th{border:1px solid #000;padding:.4rem;text-align:left;vertical-align:top}pre{white-space:pre-wrap;border:1px solid #000;padding:.75rem;overflow:auto}button,input,select{background:#fff;color:#000;border:1px solid #000;padding:.5rem .8rem}button{cursor:pointer}textarea{width:100%;min-height:5rem}.danger{border-width:2px}.status{font-weight:bold}form{margin:.75rem 0}.trace{display:flex;flex-direction:column;gap:.6rem;margin-top:.75rem}.trace-entry{border:1px solid #d8dee4;border-left-width:.45rem;border-radius:.45rem;padding:.65rem .75rem;background:#f6f8fa}.trace-meta{display:flex;align-items:center;gap:.5rem;margin-bottom:.35rem;font-size:.85rem}.trace-time{color:#57606a}.trace-badge{font-weight:700;border-radius:999px;padding:.12rem .5rem;font-size:.78rem}.trace-message{border-left-color:#0969da;background:#eef6ff}.trace-message .trace-badge{background:#0969da;color:#fff}.trace-tool{border-left-color:#8250df;background:#f7f1ff}.trace-tool .trace-badge{background:#8250df;color:#fff}.trace-supervisor{border-left-color:#1a7f37;background:#effaf2}.trace-supervisor .trace-badge{background:#1a7f37;color:#fff}.trace-rpc{border-left-color:#bf8700;background:#fff8c5}.trace-rpc .trace-badge{background:#bf8700;color:#111}.trace-error{border-left-color:#cf222e;background:#ffebe9}.trace-error .trace-badge{background:#cf222e;color:#fff}.trace-log{border-left-color:#6e7781;background:#f6f8fa}.trace-log .trace-badge{background:#6e7781;color:#fff}.trace-text{white-space:pre-wrap;font-family:ui-monospace,SFMono-Regular,Consolas,monospace}</style>
<script>document.addEventListener('DOMContentLoaded',()=>{const fmt=new Intl.DateTimeFormat(undefined,{dateStyle:'medium',timeStyle:'medium'});document.querySelectorAll('time.local-time[data-utc]').forEach((el)=>{const value=el.getAttribute('data-utc');const date=new Date(value);if(!Number.isNaN(date.getTime())){el.textContent=fmt.format(date);el.title=value;}});});</script>
</head><body>
<nav><strong>Tuna Operator Console</strong> <a href="/">Dashboard</a><a href="/builds">Builds</a><a href="/loops">Loops</a><a href="/tasks">Tasks</a><a href="/notifications">Notifications</a><a href="/updates">Tune Updates</a><a href="/logs">Blackbox Logs</a><a href="/analysis">Analysis</a></nav>
{% block body %}{% endblock %}
</body></html>
